# Push a tag like v0.2.0 (matching native/Cargo.toml) to build and publish Liemo: signed and
# notarised for Apple silicon and Intel Macs, plus Windows and Linux builds. The app's updater
# reads the resulting GitHub Release. Secrets and setup: native/RELEASING.md.
#
# Run it by hand (Actions → Release → Run workflow) for a dry run: Windows and Linux are built
# and kept as artifacts, nothing is published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15        # arm64
          - runner: macos-15-intel  # x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag is $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }

      - name: FFmpeg
        run: brew install ffmpeg pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          kc=$RUNNER_TEMP/build.keychain-db
          pw=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Notary credentials
        # Fail in seconds, not after the build, if the Apple ID or app-specific password is wrong.
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool history --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" >/dev/null \
            || { echo "::error::Apple rejected APPLE_ID / APPLE_APP_PASSWORD for team $APPLE_TEAM_ID (see native/RELEASING.md)"; exit 1; }

      - name: Build, bundle, sign, notarise
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          LIEMO_UPDATE_KEY: ${{ secrets.LIEMO_UPDATE_KEY }}
        run: |
          [ -n "$LIEMO_UPDATE_KEY" ] || { echo "::error::LIEMO_UPDATE_KEY isn't set; installed copies couldn't verify this release"; exit 1; }
          scripts/bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: liemo-${{ matrix.runner }}
          path: |
            native/dist/*.zip
            native/dist/*.zip.sig
            native/dist/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libssl-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build
        run: cargo build --release --bin rayna
      - name: Package
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          d=dist/Liemo-$v-linux-x86_64
          mkdir -p "$d"
          cp target/release/rayna "$d/liemo"
          cp assets/app/AppIcon.png "$d/liemo.png"
          printf '[Desktop Entry]\nType=Application\nName=Liemo\nComment=Video editor\nExec=liemo\nIcon=liemo\nCategories=AudioVideo;Video;\n' > "$d/liemo.desktop"
          printf 'Liemo %s for Linux (x86_64)\n\nRun ./liemo. Needs FFmpeg 6 or newer (Ubuntu/Debian: sudo apt install ffmpeg)\nand a Vulkan driver for the GPU effects.\n' "$v" > "$d/README.txt"
          tar -C dist -czf "$d.tar.gz" "$(basename "$d")"
      - name: Sign for the updater
        env:
          LIEMO_UPDATE_KEY: ${{ secrets.LIEMO_UPDATE_KEY }}
        run: |
          [ -n "$LIEMO_UPDATE_KEY" ] || { echo "::error::LIEMO_UPDATE_KEY isn't set; installed copies couldn't verify this release"; exit 1; }
          for f in dist/*.tar.gz; do target/release/rayna sign-update - "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: liemo-linux
          path: |
            native/dist/*.tar.gz
            native/dist/*.tar.gz.sig
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: native
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg (LGPL, shared)
        run: |
          # The same FFmpeg major version the Mac build uses (Homebrew's).
          curl -fsSLo ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip
          unzip -q ffmpeg.zip -d "$RUNNER_TEMP"
          dir=$(ls -d "$RUNNER_TEMP"/ffmpeg-n9.0-* | head -1)
          echo "FFMPEG_DIR=$(cygpath -w "$dir")" >> "$GITHUB_ENV"
          echo "FFMPEG_BIN=$dir/bin" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build
        run: cargo build --release --bin rayna
      - name: Package
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          d=dist/Liemo-$v-windows-x86_64
          mkdir -p "$d"
          cp target/release/rayna.exe "$d/Liemo.exe"
          cp "$FFMPEG_BIN"/*.dll "$d/"
          printf 'Liemo %s for Windows (x86_64)\r\n\r\nRun Liemo.exe. FFmpeg (LGPL) is included; see https://ffmpeg.org.\r\n' "$v" > "$d/README.txt"
          (cd dist && 7z a -tzip "$(basename "$d").zip" "$(basename "$d")" >/dev/null)
      - name: Sign for the updater
        env:
          LIEMO_UPDATE_KEY: ${{ secrets.LIEMO_UPDATE_KEY }}
        run: |
          [ -n "$LIEMO_UPDATE_KEY" ] || { echo "::error::LIEMO_UPDATE_KEY isn't set; installed copies couldn't verify this release"; exit 1; }
          # The program needs its FFmpeg DLLs to start, even just to sign.
          export PATH="$FFMPEG_BIN:$PATH"
          for f in dist/*.zip; do target/release/rayna.exe sign-update - "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: liemo-windows
          path: |
            native/dist/*.zip
            native/dist/*.zip.sig
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Liemo ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
