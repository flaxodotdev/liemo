name: Liemo
options:
  bundleIdPrefix: dev.flaxo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "B5UL5U45T7"
targets:
  Liemo:
    type: application
    platform: iOS
    sources:
      - path: Liemo
      - path: Generated/liemo_mobile.swift
    dependencies:
      - framework: LiemoCore.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AVFoundation.framework
      - sdk: Photos.framework
      - sdk: Accelerate.framework
      - sdk: ShazamKit.framework
      - sdk: libc++.tbd
      - sdk: libresolv.tbd
    info:
      path: Liemo/Info.plist
      properties:
        CFBundleDisplayName: Liemo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        NSPhotoLibraryAddUsageDescription: Liemo saves your exported videos to Photos.
        NSPhotoLibraryUsageDescription: Liemo imports the photos and videos you choose.
        NSMicrophoneUsageDescription: Liemo records voiceovers for your videos.
        NSSpeechRecognitionUsageDescription: Liemo turns what's said in your video into captions, on this device.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.flaxo.liemo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
