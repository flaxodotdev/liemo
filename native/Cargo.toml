[package]
name = "rayna"
version = "0.3.0"
edition = "2021"
description = "Rayna video editor, native (GPUI)"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["runtime_shaders", "font-kit"] }
gpui-component = "0.9.0"
gpui-kit-assets = "0.9.0"
futures = "0.3"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl", "glsl"] }
pollster = "0.4"
ffmpeg-next = "9.0.0"
tiny-skia = "0.12.0"
rustybuzz = "0.20.1"
cpal = "0.18.2"
gif = "0.14.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
dirs = "6"
smallvec = "1"
# Updates: GitHub Releases over HTTPS, update archives signed with ed25519.
ureq = "3"
ed25519-dalek = "2"
base64 = "0.22"
# Installed system fonts for text clips (already in the tree via gpui).
fontdb = "0.23"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false

# gpui-pre-macos 0.3.11 uses Option::map_or_default, stable only from Rust 1.97. A vendored copy
# with that one call spelled out keeps the crate building on Rust 1.96.
[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

[lints.rust]
# Set by the iOS engine crate (native/mobile) for the code both apps share.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(liemo_mobile)"] }

[workspace]
members = [".", "mobile"]
