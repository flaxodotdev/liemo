[package]
name = "rayna"
version = "0.7.0"
edition = "2021"
description = "Rayna video editor, native (GPUI)"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["runtime_shaders", "font-kit"] }
gpui-component = "0.9.0"
gpui-kit-assets = "0.9.0"
futures = "0.3"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl", "glsl"] }
pollster = "0.4"
ffmpeg-next = "9.0.0"
tiny-skia = "0.12.0"
rustybuzz = "0.20.1"
cpal = "0.18.2"
gif = "0.14.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
dirs = "6"
smallvec = "1"
# Updates: GitHub Releases over HTTPS, update archives signed with ed25519.
ureq = "3"
ed25519-dalek = "2"
base64 = "0.22"
# Installed system fonts for text clips (already in the tree via gpui).
fontdb = "0.23"

# macOS: Apple's Vision finds the subject for Remove background.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSIndexSet", "NSLocale", "NSOperation", "NSString", "NSURL"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-video", "objc2-core-graphics", "VNRequestHandler", "VNRequest", "VNObservation", "VNGeneratePersonSegmentationRequest", "VNGenerateForegroundInstanceMaskRequest", "VNStatefulRequest", "VNTypes"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVImageBuffer", "CVBase", "CVBuffer", "CVReturn", "CVPixelFormatDescription"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGColorSpace", "CGDataProvider"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData"] }
# Auto captions: Apple's Speech framework, on the device.
objc2-speech = { version = "0.3", default-features = false, features = ["std", "block2", "SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFTranscription", "SFTranscriptionSegment"] }
block2 = "0.6"

# Linux and Windows: GPUI's windowing, and Vulkan / DirectX 12 for the GPU effects.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["runtime_shaders", "font-kit", "wayland", "x11"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl", "glsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "wgsl", "glsl"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false

# gpui-pre-macos 0.3.11 uses Option::map_or_default, stable only from Rust 1.97. A vendored copy
# with that one call spelled out keeps the crate building on Rust 1.96.
[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

[lints.rust]
# Set by the iOS engine crate (native/mobile) for the code both apps share.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(liemo_mobile)"] }

[workspace]
members = [".", "mobile"]
